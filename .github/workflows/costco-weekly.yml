name: Costco weekly page

on:
  schedule:
    # 매주 금요일 17:00 KST = 금요일 08:00 UTC
    - cron: "0 8 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r costco/requirements.txt
      - run: python costco/build.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add costco/index.html
          git diff --cached --quiet || git commit -m "Update weekly Costco picks"
          git push
